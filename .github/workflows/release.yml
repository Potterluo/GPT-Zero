name: release

# 发布流水线：push tag `v*` 触发一次，同时产出：
#   1. sdist + wheel → PyPI（Trusted Publishing，免 token；见 docs/RELEASE.md）
#   2. ghcr.io/<owner>/<repo> 多架构镜像（amd64 + arm64 原生 runner，无 QEMU）
# tag 必须与 gptzero/__init__.py 的 __version__ 一致（如 v4.0.0 ↔ 4.0.0）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 校验：tag 与包版本一致，Python 单测全绿（发布前最后闸门）
  # ---------------------------------------------------------------------------
  verify:
    name: verify tag ↔ version + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: tag 必须与包版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "from gptzero import __version__; print(__version__)")"
          echo "tag=${GITHUB_REF_NAME} package=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 gptzero.__version__=${PKG_VERSION} 不一致"
            exit 1
          fi

      - name: 单元测试
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # Python 打包：sdist + wheel
  # ---------------------------------------------------------------------------
  python-package:
    name: build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建 sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: 元数据自检（twine check）
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: wheel 内容自检（dashboard.html + entry points 必须在包里）
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(wheel)
          names = zf.namelist()
          assert "gptzero/dashboard.html" in names, f"dashboard.html missing from {wheel}"
          assert "gptzero/protocols.py" in names, "protocols.py missing"
          assert any(n.startswith("gptzero/cli.py") for n in names), "cli.py missing"
          assert any(n.startswith("bench/")) and not any(n.startswith("agentx")), "bench 包不完整或混入 agentx"
          dist_info = [n for n in names if n.endswith(".dist-info/entry_points.txt")]
          assert dist_info, "entry_points.txt missing"
          print(f"OK: {wheel} ({len(names)} files)\nentry_points:\n{zf.read(dist_info[0]).decode()}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 发布到 PyPI（Trusted Publishing：需要在 PyPI 项目页配置一次 publisher，
  # 见 docs/RELEASE.md §3；未配置时此 job 失败但镜像发布不受影响）
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: publish to PyPI
    needs: python-package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: 发布（OIDC，无需 token）
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # Docker 多架构镜像：amd64 / arm64 各自原生构建并按 digest 推送，最后合并 manifest
  # ---------------------------------------------------------------------------
  docker-amd64:
    name: docker (linux/amd64)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名（ghcr.io/<owner>/<repo>，强制小写）
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true

  docker-arm64:
    name: docker (linux/arm64)
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名（ghcr.io/<owner>/<repo>，强制小写）
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true

  docker-manifest:
    name: merge manifest + tags
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: 计算镜像名（ghcr.io/<owner>/<repo>，强制小写）
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并两架构并打 tag（v<version> + latest）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@sha256:${{ needs.docker-amd64.outputs.digest }}" \
            "${IMAGE}@sha256:${{ needs.docker-arm64.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
