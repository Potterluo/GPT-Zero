[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-mock"
dynamic = ["version"]
description = "Offline multi-protocol mock LLM server (OpenAI Chat Completions / Responses / Anthropic Messages) for agentic benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GPT-Zero Contributors" }]
keywords = ["mock", "llm", "openai", "anthropic", "benchmark", "offline"]

dependencies = [
  "fastapi>=0.109",
  "uvicorn>=0.20",
  "pydantic>=2.5",
  # token 计数的精确实现（HFTokenCodec 首选运行时，Rust wheel、无 torch）。
  # 配套包内内置 tokenizer（gptzero/tokenizer/，即仓库根 deepseek_v3_tokenizer 的副本），
  # 让 `pip install openai-mock` 开箱即得精确 token 计数，而无需仓库 checkout。
  "tokenizers>=0.19",
]

[project.urls]
Homepage = "https://github.com/Potterluo/GPT-Zero"
Documentation = "https://potterluo.github.io/GPT-Zero/"
Repository = "https://github.com/Potterluo/GPT-Zero"
Issues = "https://github.com/Potterluo/GPT-Zero/issues"
Changelog = "https://github.com/Potterluo/GPT-Zero/releases"

[project.optional-dependencies]
bench = ["httpx>=0.25", "matplotlib>=3.9", "numpy>=1.26"]
tokenizer = ["transformers>=4.40"]
dev = [
  "httpx>=0.25",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
gptzero = "gptzero.cli:main"
gptzero-bench = "bench.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gptzero.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gptzero*", "bench*"]

[tool.setuptools.package-data]
# tokenizer/ 是仓库根 deepseek_v3_tokenizer/ 的副本（tokenizer.py 的 _candidate_paths
# 已把 gptzero/tokenizer/ 作为 auto 的最后一个候选）：打包进 wheel 后，pip 安装的用户
# 不需要仓库 checkout 就有精确 token 计数（纯离线，不下载任何东西）。
gptzero = ["dashboard.html", "tokenizer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
