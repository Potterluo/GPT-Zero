name: pages

# GitHub Pages 站点：企业简洁风落地页（site-src/，SEO + GEO）+ mkdocs 文档（/docs/ 子路径）
#   仓库 Settings → Pages → Build and deployment → Source: GitHub Actions（一次性配置）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site (landing + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 mkdocs-material
        run: pip install mkdocs-material

      - name: 构建 mkdocs 文档（strict，输出到 site-docs/）
        run: mkdocs build --strict --site-dir site-docs

      - name: 组装站点（落地页在根路径，文档在 /docs/ 子路径）
        run: |
          mkdir -p site/docs
          cp -r site-src/. site/
          cp -r site-docs/. site/docs/
          echo "-- site root --"
          ls site
          echo "-- site/docs --"
          ls site/docs | head -20

      - name: SEO/GEO 自检（关键文件与标记必须在产物里）
        run: |
          set -e
          grep -q 'application/ld+json' site/index.html
          grep -q 'name="description"' site/index.html
          grep -q 'rel="canonical"' site/index.html
          test -f site/llms.txt
          test -f site/sitemap.xml
          grep -q 'potterluo.github.io/GPT-Zero/docs/' site/sitemap.xml
          echo "SEO/GEO self-check OK"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
