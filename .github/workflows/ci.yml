name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（可编辑安装 + dev extras）
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: 字节码编译检查（含 bench）
        run: python -m compileall -q gptzero bench tests server.py

      - name: 单元测试
        run: python -m pytest -q

      - name: 冒烟（起 mock + 打端点，不依赖 Docker）
        run: |
          # 服务端口用 8090（本机 8080 常被占用；CI 上仅为了与镜像保持一致）
          GPTZERO_PORT=8090 SMOKE_START_TIMEOUT=90 bash scripts/smoke.sh

  docker:
    name: docker build + 断网 smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送任何 registry）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gptzero:v4
          build-args: |
            WITH_TRANSFORMERS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像体积
        run: docker images gptzero:v4 --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: 断网自检（--network none）
        run: docker run --rm --network none -e GPTZERO_PORT=8090 gptzero:v4 smoke
